00" fill="#59594f" text-anchor="start">risk_assessment.json</text><path d="M500 552 V568 Q500 576 492 576 H340 Q332 576 332 584 V598" stroke="#c2c2b9" stroke-width="1" fill="none"></path><path d="M500 552 V568 Q500 576 508 576 H660 Q668 576 668 584 V598" stroke="#c2c2b9" stroke-width="1" fill="none"></path><path d="M327.5 598 L332 605 L336.5 598 Z" fill="#c2c2b9"></path><path d="M663.5 598 L668 605 L672.5 598 Z" fill="#c2c2b9"></path><text x="514" y="568" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" font-weight="400" fill="#8f8f86" text-anchor="start">parallel fan-out</text><rect x="180" y="610" width="304" height="142" rx="10" fill="#ffffff" stroke="#dcdcd4" stroke-width="1"></rect><rect x="198" y="634" width="7" height="7" rx="2" fill="#2b7f86"></rect><text x="214" y="641" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#2b7f86" text-anchor="start" letter-spacing="1">PHASE 3A</text><text x="198" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1c1a" text-anchor="start">Test Writer</text><text x="198" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b6b64" text-anchor="start">Black-box characterization tests</text><text x="198" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b6b64" text-anchor="start">that pin current behavior.</text><rect x="198" y="720" width="126" height="22" rx="5" fill="#f7f7f3" stroke="#e2e2da" stroke-width="1"></rect><text x="207" y="735.32" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#59594f" text-anchor="start">tests/&lt;target&gt;/</text><rect x="516" y="610" width="304" height="142" rx="10" fill="#ffffff" stroke="#dcdcd4" stroke-width="1"></rect><rect x="534" y="634" width="7" height="7" rx="2" fill="#2b7f86"></rect><text x="550" y="641" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#2b7f86" text-anchor="start" letter-spacing="1">PHASE 3B</text><text x="534" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1c1a" text-anchor="start">Refactor Planner</text><text x="534" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b6b64" text-anchor="start">Ordered, pattern-based stage plan —</text><text x="534" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b6b64" text-anchor="start">strangler-fig, branch-by-abstraction.</text><rect x="534" y="720" width="147.6" height="22" rx="5" fill="#f7f7f3" stroke="#e2e2da" stroke-width="1"></rect><text x="543" y="735.32" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#59594f" text-anchor="start">refactor_plan.json</text><path d="M332 752 V770 Q332 778 340 778 H492 Q500 778 500 786 V798" stroke="#c2c2b9" stroke-width="1" fill="none"></path><path d="M668 752 V770 Q668 778 660 778 H508 Q500 778 500 786 V798" stroke="#c2c2b9" stroke-width="1" fill="none"></path><path d="M495.5 798 L500 805 L504.5 798 Z" fill="#c2c2b9"></path><rect x="180" y="810" width="640" height="86" rx="10" fill="#fdf7ec" stroke="#c8912f" stroke-width="1.5" stroke-dasharray="5 4"></rect><rect x="200" y="834" width="7" height="7" rx="2" fill="#a86f1c"></rect><text x="216" y="841" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#a86f1c" text-anchor="start" letter-spacing="1">PHASE 4 · MANUAL</text><text x="339.6" y="842" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1c1a" text-anchor="start">Human Gate</text><text x="200" y="870" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b6b64" text-anchor="start">No agent. A human reviews the tests and the full stage plan, then approves or rejects.</text><rect x="669.6" y="828" width="130.39999999999998" height="26" rx="5" fill="#ffffff" stroke="#e0c79b" stroke-width="1"></rect><text x="679.6" y="845" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" font-weight="400" fill="#96631a" text-anchor="start">approve / reject</text><path d="M500 896 V922" stroke="#c2c2b9" stroke-width="1"></path><path d="M495.5 922 L500 930 L504.5 922 Z" fill="#c2c2b9"></path><rect x="180" y="930" width="640" height="132" rx="10" fill="#ffffff" stroke="#dcdcd4" stroke-width="1"></rect><rect x="200" y="954" width="7" height="7" rx="2" fill="#3f6396"></rect><text x="216" y="961" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#3f6396" text-anchor="start" letter-spacing="1">PHASE 5</text><text x="280.2" y="962" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1c1a" text-anchor="start">Stage Executor</text><rect x="420.76" y="948" width="101.8" height="20" rx="4" fill="#ffffff" stroke="#dcdcd4" stroke-width="1"></rect><text x="428.76" y="962" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#77776f" text-anchor="start">×N sequential</text><text x="200" y="990" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b6b64" text-anchor="start">One dispatch per stage, run in plan order:</text><rect x="200" y="1006" width="77.0625" height="26" rx="5" fill="#f7f7f3" stroke="#e2e2da" stroke-width="1"></rect><text x="209" y="1023.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a43" text-anchor="start">implement</text><text x="285.0625" y="1023" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b5b5ab" text-anchor="start">→</text><rect x="303.0625" y="1006" width="77.0625" height="26" rx="5" fill="#f7f7f3" stroke="#e2e2da" stroke-width="1"></rect><text x="312.0625" y="1023.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a43" text-anchor="start">run tests</text><text x="388.125" y="1023" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b5b5ab" text-anchor="start">→</text><rect x="406.125" y="1006" width="109.875" height="26" rx="5" fill="#fdf7ec" stroke="#e0c79b" stroke-width="1"></rect><text x="415.125" y="1023.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#96631a" text-anchor="start">human approval</text><text x="524" y="1023" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b5b5ab" text-anchor="start">→</text><rect x="542" y="1006" width="57.375" height="26" rx="5" fill="#f7f7f3" stroke="#e2e2da" stroke-width="1"></rect><text x="551" y="1023.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4a4a43" text-anchor="start">commit</text><path d="M820 960 H854 V1044 H832" stroke="#b9b9b0" stroke-width="1" fill="none" stroke-dasharray="3 3"></path><path d="M832 1039.5 L825 1044 L832 1048.5 Z" fill="#b9b9b0"></path><text x="864" y="1032" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" font-weight="400" fill="#8f8f86" text-anchor="start">repeat</text><text x="864" y="1047" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11.5" font-weight="400" fill="#8f8f86" text-anchor="start">per stage</text><path d="M500 1062 V1088" stroke="#c2c2b9" stroke-width="1"></path><path d="M495.5 1088 L500 1096 L504.5 1088 Z" fill="#c2c2b9"></path><rect x="180" y="1096" width="640" height="104" rx="10" fill="#ffffff" stroke="#dcdcd4" stroke-width="1"></rect><rect x="200" y="1120" width="7" height="7" rx="2" fill="#3f6396"></rect><text x="216" y="1127" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#3f6396" text-anchor="start" letter-spacing="1">PHASE 6</text><text x="280.2" y="1128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1c1c1a" text-anchor="start">Synthesizer</text><text x="200" y="1154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b6b64" text-anchor="start">Reads every prior artifact plus the git log of landed stages.</text><rect x="200" y="1168" width="154.79999999999998" height="22" rx="5" fill="#f7f7f3" stroke="#e2e2da" stroke-width="1"></rect><text x="209" y="1183.32" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#59594f" text-anchor="start">synthesis_report.md</text><path d="M500 1200 V1226" stroke="#c2c2b9" stroke-width="1"></path><path d="M495.5 1226 L500 1234 L504.5 1226 Z" fill="#c2c2b9"></path><rect x="392.325" y="1234" width="215.35" height="38" rx="19" fill="#ffffff" stroke="#cfcfc7" stroke-width="1"></rect><circle cx="414.325" cy="1253" r="3.5" fill="#8a8a80"></circle><text x="424.325" y="1258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3a3a36" text-anchor="start">Modernization roadmap</text><path d="M56 1316 H944" stroke="#e4e4dc" stroke-width="1"></path><rect x="56" y="1330" width="7" height="7" rx="2" fill="#b5b5ab"></rect><text x="72" y="1338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#77776f" text-anchor="start">Every arrow between phases is a pydantic-validated JSON</text><text x="72" y="1356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#77776f" text-anchor="start">handoff — agents share no context.</text><rect x="520" y="1330" width="7" height="7" rx="2" fill="#a86f1c"></rect><text x="536" y="1338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#77776f" text-anchor="start">Phase 4 and every Phase 5 stage commit require explicit</text><text x="536" y="1356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#77776f" text-anchor="start">human approval; passing tests alone never trigger a commit.</text></g></svg>